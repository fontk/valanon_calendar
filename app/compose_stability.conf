// Types the Compose compiler cannot prove stable but that are immutable in this app.
// Without this, UI state and the 28–31 month cells (which take LocalDate) are compared by
// reference and recompose on every pass even when nothing changed.
// See https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// java.time value types are immutable.
java.time.LocalDate
java.time.YearMonth

// The app only exposes read-only Kotlin collections built from Flow emissions; they are never
// mutated after being placed in UI state.
kotlin.collections.*
