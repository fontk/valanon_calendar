<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis turnos – Selector de mes y año</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#1C1C1A;background:#FFFFFF}
a{color:#0F6E64}a:hover{color:#0B544C}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: Manrope, system-ui, sans-serif">

  <div style="padding: 22px 20px 10px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 700; color: #5F5F5A; letter-spacing: 0.08em; text-transform: uppercase">Mis turnos</div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Mes anterior" onClick="{{prevMonth}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E6E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <button onClick="{{openMes}}" aria-label="Elegir mes y año" style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #F2F2EF; color: #1C1C1A; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">
        {{monthLabel}}
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F5F5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button aria-label="Mes siguiente" onClick="{{nextMonth}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E6E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 20px 14px">
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #F2F2EF; color: #5B5B57; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A9A95"></span>Libre</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #FFE9A8; color: #6B4A00; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D99E00"></span>Mañana</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #CFE4FF; color: #12407A; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2F7BD8"></span>Tarde</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #2E2A6B; color: #FFFFFF; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B9B4FF"></span>Noche</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #CDEFD5; color: #145229; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E9E55"></span>Vacaciones</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 16px 6px">
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">L</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">M</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">X</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">J</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">V</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">S</div>
    <div style="text-align: center; font-size: 12px; font-weight: 700; color: #7A7A75">D</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 16px; flex-grow: 1; align-content: start">
    <sc-for list="{{cells}}" as="d" hint-placeholder-count="35">
      <button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="height: 60px; border-radius: 12px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; visibility: {{d.vis}}">
        <span style="font-size: 15px; font-weight: 800">{{d.num}}</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em">{{d.tag}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 10px 20px 12px">
    <button onClick="{{exportPdf}}" style="width: 100%; height: 52px; border-radius: 14px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M12 11v6"></path><path d="M9 14l3 3 3-3"></path></svg>
      Exportar a PDF
    </button>
  </div>

  <div style="height: 72px; border-top: 1px solid #ECECE8; background: #FFFFFF; display: flex">
    <div aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; text-decoration: none">
      <span style="padding: 4px 14px; border-radius: 999px; background: #DDF0EC; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="font-size: 12px; font-weight: 800">Calendario</span>
    </div>
    <a href="Turnos.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F5F5A; text-decoration: none">
      <span style="padding: 4px 14px; border-radius: 999px; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
      <span style="font-size: 12px; font-weight: 700">Turnos</span>
    </a>
    <a href="Checklist.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F5F5A; text-decoration: none">
      <span style="padding: 4px 14px; border-radius: 999px; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"></path><rect x="3" y="4" width="18" height="16" rx="2"></rect></svg></span>
      <span style="font-size: 12px; font-weight: 700">Checklist</span>
    </a>
    <a href="Plantillas.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F5F5A; text-decoration: none">
      <span style="padding: 4px 14px; border-radius: 999px; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 13l9 5 9-5"></path><path d="M3 17l9 5 9-5"></path></svg></span>
      <span style="font-size: 12px; font-weight: 700">Plantillas</span>
    </a>
    <a href="Ajustes.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F5F5A; text-decoration: none">
      <span style="padding: 4px 14px; border-radius: 999px; display: flex"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span>
      <span style="font-size: 12px; font-weight: 700">Ajustes</span>
    </a>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(20, 20, 19, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #D8D8D3; align-self: center"></div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; font-weight: 700; color: #5F5F5A; letter-spacing: 0.08em; text-transform: uppercase">Turno del día</div>
          <div style="font-size: 20px; font-weight: 800">{{sheetTitle}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{options}}" as="o" hint-placeholder-count="5">
            <button onClick="{{o.choose}}" style="height: 52px; border-radius: 14px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: {{o.border}}; background: #FFFFFF; color: #1C1C1A; font-size: 16px; font-weight: 700; text-align: left">
              <span style="width: 28px; height: 28px; border-radius: 8px; background: {{o.swatch}}; flex-shrink: 0"></span>
              <span style="flex-grow: 1">{{o.label}}</span>
              <span style="font-size: 13px; font-weight: 700; color: {{accent}}">{{o.check}}</span>
            </button>
          </sc-for>
        </div>
        <button onClick="{{closeSheet}}" style="height: 48px; border-radius: 14px; border: none; background: #F2F2EF; color: #1C1C1A; font-size: 15px; font-weight: 700">Cancelar</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{mesOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(20, 20, 19, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #D8D8D3; align-self: center"></div>
        <div style="font-size: 12px; font-weight: 700; color: #5F5F5A; letter-spacing: 0.08em; text-transform: uppercase">Ir a mes</div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <button aria-label="Año anterior" onClick="{{prevAnio}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E6E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
          </button>
          <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em">{{anioLabel}}</div>
          <button aria-label="Año siguiente" onClick="{{nextAnio}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E6E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{meses}}" as="m" hint-placeholder-count="12">
            <button onClick="{{m.pick}}" aria-label="{{m.aria}}" style="height: 52px; border-radius: 14px; border: {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; font-weight: 700; padding: 0">{{m.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px">
          <button onClick="{{irHoy}}" style="flex: 1 1 0; height: 48px; border-radius: 14px; border: 1px solid {{accent}}; background: #FFFFFF; color: {{accent}}; font-size: 15px; font-weight: 700">Hoy</button>
          <button onClick="{{closeMes}}" style="flex: 1 1 0; height: 48px; border-radius: 14px; border: none; background: #F2F2EF; color: #1C1C1A; font-size: 15px; font-weight: 700">Cancelar</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E64","options":["#0F6E64","#2E2A6B","#B4421E"]},"$preview":{"width":390,"height":844}}'>
var TURNOS = {
  libre:      { label: 'Libre',      tag: 'LIBRE', bg: '#F2F2EF', fg: '#5B5B57', border: '1px solid #E4E4E0', swatch: '#D9D9D4' },
  manana:     { label: 'Mañana',     tag: 'MAÑ',   bg: '#FFE9A8', fg: '#6B4A00', border: '1px solid #F3D77A', swatch: '#FFD766' },
  tarde:      { label: 'Tarde',      tag: 'TARDE', bg: '#CFE4FF', fg: '#12407A', border: '1px solid #A9CBF5', swatch: '#8FBDF5' },
  noche:      { label: 'Noche',      tag: 'NOCHE', bg: '#2E2A6B', fg: '#FFFFFF', border: '1px solid #2E2A6B', swatch: '#2E2A6B' },
  vacaciones: { label: 'Vacaciones', tag: 'VAC',   bg: '#CDEFD5', fg: '#145229', border: '1px solid #A6DDB4', swatch: '#8EDBA4' }
};
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var shifts = {};
    var patron = ['manana','manana','tarde','tarde','noche','noche','libre','libre'];
    for (var d = 1; d <= 31; d++) {
      var t = d >= 26 ? 'vacaciones' : patron[(d - 1) % patron.length];
      shifts['2026-10-' + (d < 10 ? '0' + d : d)] = t;
    }
    this.state = { y: 2026, m: 9, open: null, shifts: shifts, mesOpen: true, anio: 2026 };
  }
  key(y, m, d) { return y + '-' + (m + 1 < 10 ? '0' + (m + 1) : (m + 1)) + '-' + (d < 10 ? '0' + d : d); }
  renderVals() {
    var self = this;
    var s = this.state;
    var accent = this.props.accent || '#0F6E64';
    var first = (new Date(s.y, s.m, 1).getDay() + 6) % 7;
    var total = new Date(s.y, s.m + 1, 0).getDate();
    var today = new Date(2026, 9, 17);
    var cells = [];
    for (var b = 0; b < first; b++) {
      cells.push({ num: '', tag: '', aria: '', vis: 'hidden', bg: 'transparent', fg: 'transparent', border: 'none', pick: function () {} });
    }
    for (var d = 1; d <= total; d++) {
      (function (day) {
        var k = self.key(s.y, s.m, day);
        var t = s.shifts[k] ? TURNOS[s.shifts[k]] : null;
        var isToday = s.y === today.getFullYear() && s.m === today.getMonth() && day === today.getDate();
        cells.push({
          num: String(day),
          tag: t ? t.tag : '',
          aria: day + ' de ' + MESES[s.m] + (t ? ', ' + t.label : ', sin turno'),
          vis: 'visible',
          bg: t ? t.bg : '#FFFFFF',
          fg: t ? t.fg : '#1C1C1A',
          border: isToday ? '2px solid ' + accent : (t ? t.border : '1px solid #E8E8E4'),
          pick: function () { self.setState({ open: day }); }
        });
      })(d);
    }
    var options = Object.keys(TURNOS).map(function (id) {
      var t = TURNOS[id];
      var cur = s.open != null && s.shifts[self.key(s.y, s.m, s.open)] === id;
      return {
        label: t.label,
        swatch: t.swatch,
        border: cur ? '2px solid ' + accent : '1px solid #E6E6E1',
        check: cur ? 'Actual' : '',
        choose: function () {
          var next = Object.assign({}, s.shifts);
          next[self.key(s.y, s.m, s.open)] = id;
          self.setState({ shifts: next, open: null });
        }
      };
    });
    var sheetTitle = '';
    if (s.open != null) {
      var dt = new Date(s.y, s.m, s.open);
      var dn = DIAS[dt.getDay()];
      sheetTitle = dn.charAt(0).toUpperCase() + dn.slice(1) + ', ' + s.open + ' de ' + MESES[s.m];
    }
    var meses = MESES.map(function (nombre, idx) {
      var esActivo = s.anio === s.y && idx === s.m;
      var esHoy = s.anio === today.getFullYear() && idx === today.getMonth();
      return {
        label: nombre.slice(0, 3).toUpperCase(),
        aria: nombre + ' de ' + s.anio,
        bg: esActivo ? accent : '#FFFFFF',
        fg: esActivo ? '#FFFFFF' : '#1C1C1A',
        border: esActivo ? '2px solid ' + accent : (esHoy ? '2px solid #B9CFCB' : '1px solid #E6E6E1'),
        pick: function () { self.setState({ y: s.anio, m: idx, mesOpen: false }); }
      };
    });
    var ml = MESES[s.m];
    return {
      accent: accent,
      monthLabel: ml.charAt(0).toUpperCase() + ml.slice(1) + ' ' + s.y,
      cells: cells,
      sheetOpen: s.open != null,
      sheetTitle: sheetTitle,
      options: options,
      mesOpen: s.mesOpen,
      anioLabel: String(s.anio),
      meses: meses,
      openMes: function () { self.setState({ mesOpen: true, anio: s.y }); },
      closeMes: function () { self.setState({ mesOpen: false }); },
      prevAnio: function () { self.setState({ anio: s.anio - 1 }); },
      nextAnio: function () { self.setState({ anio: s.anio + 1 }); },
      irHoy: function () { self.setState({ y: today.getFullYear(), m: today.getMonth(), mesOpen: false }); },
      closeSheet: function () { self.setState({ open: null }); },
      prevMonth: function () { self.setState(s.m === 0 ? { y: s.y - 1, m: 11 } : { m: s.m - 1 }); },
      nextMonth: function () { self.setState(s.m === 11 ? { y: s.y + 1, m: 0 } : { m: s.m + 1 }); },
      exportPdf: function () {}
    };
  }
}
</script>
</body>
</html>
